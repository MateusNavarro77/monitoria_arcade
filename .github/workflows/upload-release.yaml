name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0). Leave empty to use version from pubspec.yaml"
        required: false
        type: string
        default: ""
      release_title:
        description: "Release title (e.g. Release v1.0.0). Leave empty for default"
        required: false
        type: string
        default: ""
      release_notes:
        description: "Release notes / changelog (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Upload Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: "stable"
          cache: true

      - name: Determine Version and Tag
        id: release_info
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d ' \r\n')
          echo "Found pubspec version: $VERSION"

          # Determine Tag Name
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v${VERSION}"
          fi

          # Determine Release Title
          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="Release ${TAG}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Full APK
        run: flutter build apk --release

      - name: Prepare APK Asset
        run: |
          # Locate generated APK and copy to monitoria_arcade.apk for consistent naming
          APK_SOURCE=$(find build/app/outputs -name "*release.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: No release APK found in build/app/outputs"
            exit 1
          fi
          echo "Found APK at: $APK_SOURCE"
          cp "$APK_SOURCE" build/app/outputs/monitoria_arcade.apk

      - name: Upload Artifact (Action Run)
        uses: actions/upload-artifact@v4
        with:
          name: monitoria-arcade-apk
          path: build/app/outputs/monitoria_arcade.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: ${{ github.event.inputs.release_notes }}
          files: build/app/outputs/monitoria_arcade.apk
          make_latest: true
          generate_release_notes: ${{ github.event.inputs.release_notes == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
